# One-camera robot motion and mission configuration.
# All distances are centimetres; angles are degrees; speeds are PWM 0..255.

runtime:
  control_hz: 50
  vision_hz: 20
  headless: false
  camera_stale_s: 2.0
  restart_on_arduino_boot: true
  log_dir: logs

serial:
  # Recommended: replace "auto" with the stable path shown by:
  #   ls -l /dev/serial/by-id/
  port: auto
  baud: 115200
  reconnect_s: 1.0
  ping_period_s: 0.5
  stale_link_s: 2.5

steering:
  center_deg: 90
  left_deg: 60
  right_deg: 115
  yaw_kp_norm_per_deg: 0.012
  yaw_sign: 1.0
  max_yaw_steer_norm: 0.30
  deadband_deg: 0.5

drive:
  speed: 34
  minimum_speed: 25
  slowdown_factor: 0.65
  side_slow_on_cm: 15.5
  front_slow_on_cm: 45.0
  continuous_command_period_s: 0.05

mission:
  max_turns: 4
  lock_all_turns_one_direction: true
  # AUTO, LEFT, or RIGHT
  all_turns_direction: AUTO

escape:
  enabled: true
  max_step_retries: 1
  hold_s: 0.50
  hold_speed: 40
  # steer is normalized: -1 full left, 0 center, +1 full right.
  # Every steer value is multiplied by the chosen open-side direction.
  steps:
    s1:
      direction: F
      distance_cm: 5.0
      speed: 40
      steer: 1.0
      timeout_s: 2.0
    s2:
      direction: B
      distance_cm: 4.0
      speed: 42
      steer: 1.0
      timeout_s: 2.0
    s3:
      direction: F
      distance_cm: 15.0
      speed: 38
      steer: 1.0
      timeout_s: 3.0
    s4:
      direction: F
      distance_cm: 23.0
      speed: 34
      steer: -1.0
      timeout_s: 4.0

corners:
  back_center_speed: 31
  back_stop_cm: 55.0
  default_turn:
    angle_deg: 90.0
    speed: 34
    tolerance_deg: 6.0
    timeout_s: 1.6
    mode: BACKWARD
    front_trigger_cm: 36.0
  # Optional independent overrides. Add more entries for longer missions.
  per_turn:
    "1": {angle_deg: 90.0, speed: 34, tolerance_deg: 6.0, timeout_s: 1.6, mode: BACKWARD, front_trigger_cm: 36.0}
    "2": {angle_deg: 90.0, speed: 34, tolerance_deg: 6.0, timeout_s: 1.6, mode: BACKWARD, front_trigger_cm: 36.0}
    "3": {angle_deg: 90.0, speed: 34, tolerance_deg: 6.0, timeout_s: 1.6, mode: BACKWARD, front_trigger_cm: 36.0}
    "4": {angle_deg: 90.0, speed: 34, tolerance_deg: 6.0, timeout_s: 1.6, mode: BACKWARD, front_trigger_cm: 36.0}

pillar:
  turn_angle_deg: 90.0
  turn_speed: 40
  turn_tolerance_deg: 6.0
  turn_timeout_s: 2.0
  forward_speed: 34
  forward_timeout_s: 2.5
  forward_base_cm: 2.0
  forward_gain_cm: 19.0
  forward_min_cm: 0.0
  forward_max_cm: 20.0
  return_speed: 40
  return_tolerance_deg: 5.0
  return_timeout_s: 2.0

wall_avoid:
  on_cm: 15.5
  max_bias_norm: 0.18
  min_bias_norm: 0.04
  exponent: 1.0
  invert: false

stuck_recovery:
  freeze_s: 1.20
  minimum_progress_cm: 0.60
  minimum_command_speed: 20
  state_entry_grace_s: 0.50
  max_attempts_per_state: 2
  clear_distance_cm: 12.0
  clear_speed: 36
  clear_timeout_s: 2.5
  return_speed: 38
  return_tolerance_deg: 5.0
  return_timeout_s: 2.5

last_sequence:
  enabled: true
  preturn_front_cm: 5.0
  approach_speed: 34
  back_distance_cm: 16.0
  back_speed: 40
  back_timeout_s: 3.0
  no_avoid_hold_s: 0.50
  wait_front_stop_cm: 20.0
  forward_speed: 34

  corner_turn:
    angle_deg: 90.0
    speed: 34
    tolerance_deg: 6.0
    timeout_s: 1.5

  t1:
    angle_deg: 90.0
    speed: 36
    tolerance_deg: 4.0
    timeout_s: 2.0

  # RET1 targets the main corridor yaw and is forced opposite to T1.
  # It intentionally uses the same speed/tolerance/timeout as T1.

  fwd1_cm: 5.0
  fwd1_timeout_s: 2.0
  fwd2_cm: 18.0
  fwd2_timeout_s: 3.0

  t2:
    angle_deg: 90.0
    speed: 36
    tolerance_deg: 4.0
    timeout_s: 2.0

  fwd3_cm: 25.0
  # FWD3 stops on encoder distance OR this timeout/block/stall result.
  fwd3_timeout_s: 2.0

  final_return:
    offset_deg: 0.0
    speed: 35
    tolerance_deg: 3.0
    timeout_s: 2.7
